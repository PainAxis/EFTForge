<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>EFTForge</title>
<style>
  @font-face {
    font-family: "Bender";
    src: url("fonts/Bender.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Bender";
    src: url("fonts/Bender-Bold.woff2") format("woff2");
    font-weight: 700;
  }
  /* Same registered custom property the site uses for its signature
     bottom-right color blob - registration makes the color interpolate
     smoothly instead of snapping. Starts on the site green ("services
     starting"); the launcher calls window.__eftforgeReady() once the local
     backend actually accepts connections, easing it to the site gold that
     the app's landing screen uses, then navigates. */
  @property --blob-color {
    syntax: '<color>';
    inherits: true;
    initial-value: rgba(0, 200, 180, 0.10);
  }
  html {
    transition: --blob-color 1s ease;
  }
  html.ready {
    --blob-color: rgba(245, 197, 66, 0.10);
  }
  html, body {
    margin: 0; height: 100%;
    color: #ccc;
    font-family: "Bender", Arial, "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  body {
    /* Site background stack (minus parallax - static here): vignette on top,
       signature blob, 30px dot grid, flat base (the site's near-black linear
       gradient is dropped - it bands visibly on large flat areas). */
    background:
      radial-gradient(ellipse 100% 100% at 50% 50%, transparent 20%, rgba(0,0,0,0.72) 100%),
      radial-gradient(ellipse 70% 70% at 85% 90%, var(--blob-color), transparent 70%),
      radial-gradient(circle, rgba(255,255,255,0.11) 1px, transparent 1px),
      #121212;
    background-size: 100% 100%, 100% 100%, 30px 30px, auto;
  }
  .wrap { text-align: center; }
  .logo {
    width: 110px; height: 110px;
    object-fit: contain;
    opacity: 0.92;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .name {
    margin-top: 14px;
    font-size: 30px; font-weight: 700; letter-spacing: 2px; color: #f5c542;
  }
  .spinner {
    margin: 30px auto 20px; width: 30px; height: 30px;
    border: 3px solid #2a2a2a; border-top-color: #9a8866; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Rolling log of startup stages - keeps the last few EFTFORGE_STATUS
     updates on screen (not just the latest) so the splash reads as an
     actual progress trail instead of one line that keeps changing. */
  .log {
    margin-top: 22px; text-align: center;
    font-size: 11.5px; letter-spacing: 0.3px; line-height: 2;
  }
  .log-entry {
    color: #5c5c5c;
    transition: color 0.4s ease;
  }
  .log-entry::before { content: "\203A  "; color: #6b5f43; }
  .log-entry.current { color: #bbb; }
  .log-entry.current::before { color: #f5c542; }
  .err { display: none; margin-top: 16px; font-size: 12px; color: #c0564f; line-height: 1.7; max-width: 440px; }
  .err-detail { display: none; margin-top: 10px; font-size: 10.5px; color: #8a7a5c; line-height: 1.5; max-width: 440px; word-break: break-word; }
  /* The window has no native title bar (see main.rs), so the splash needs
     its own minimal chrome: the whole page is draggable, and a small close
     button covers the "stuck on splash and can't get rid of it" case. */
  .splash-close {
    position: fixed;
    top: 0; right: 0;
    width: 44px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    color: #666;
    cursor: pointer;
  }
  .splash-close:hover { background: #f44336; color: #fff; }
  .splash-close svg { pointer-events: none; }
</style>
</head>
<body data-tauri-drag-region>
  <button class="splash-close" id="splash-close" aria-label="Close">
    <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
  </button>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="EFTForge" draggable="false" />
    <div class="name">EFTForge</div>
    <div class="spinner"></div>
    <div class="log" id="log"></div>
    <div class="err" id="err">
      启动时间过长。请尝试重启应用；若问题持续，请在 GitHub / Gitee 提交反馈。<br>
      Startup is taking too long. Try restarting the app; if this persists,
      please open an issue on GitHub / Gitee.
    </div>
    <div class="err-detail" id="err-detail"></div>
  </div>
  <script>
    // Startup stages the backend/launcher can report via
    // EFTFORGE_STATUS=<code> lines (see backend/desktop_main.py,
    // backend/main.py and src-tauri/src/main.rs) - keyed by code, not free
    // text, so the splash stays bilingual regardless of what the backend
    // prints. Ordered roughly as they occur; not every run hits every line
    // (seed_db / first_sync are first-run-only and mutually exclusive).
    var STATUS_TEXT = {
      seed_db:            "初始化物品数据库 / Setting up item database",
      first_sync:         "未内置数据库，稍后从 tarkov.dev 同步 / No bundled DB - will sync later",
      loading_modules:    "加载核心模块 / Loading core modules",
      preparing_database: "准备数据库 / Preparing database",
      applying_updates:   "应用数据库更新 / Applying database updates",
      starting_server:    "启动 Web 服务器 / Starting web server",
      connecting:         "连接本地服务 / Connecting to local service",
      ready:              "本地服务已就绪 / Local service ready"
    };

    var MAX_LOG_LINES = 6;

    function addLogLine(text) {
      var log = document.getElementById("log");
      var prev = log.querySelector(".current");
      if (prev) prev.classList.remove("current");
      var entry = document.createElement("div");
      entry.className = "log-entry current";
      entry.textContent = text;
      log.appendChild(entry);
      while (log.children.length > MAX_LOG_LINES) {
        log.removeChild(log.firstChild);
      }
    }

    addLogLine("启动本地服务 / Starting local services");

    // Called by the launcher (via eval) as the backend reports each startup
    // stage - appends a line to the log so the splash shows the whole trail
    // of what's happened, not just the current step.
    window.__eftforgeStatus = function (code) {
      var text = STATUS_TEXT[code];
      if (text) addLogLine(text);
    };

    // Called by the launcher (via eval) once the backend port actually
    // accepts connections - transitions the blob green -> site gold; the
    // launcher navigates away after the transition completes.
    window.__eftforgeReady = function () {
      document.documentElement.classList.add("ready");
    };

    // The launcher replaces this page shortly after signaling ready;
    // if that never happens, surface a hint instead of spinning forever.
    setTimeout(function () {
      document.getElementById("err").style.display = "block";
    }, 25000);

    // Called by the launcher (via eval) when the backend sidecar itself
    // fails - spawn error or an unexpected exit before ever reporting its
    // port. Unlike the 25s timeout above (which only means "still
    // waiting"), this means startup has definitely failed, so it shows
    // right away instead of waiting out the timer, plus whatever detail
    // the launcher has (e.g. the OS spawn error or exit code) so a user's
    // bug report actually carries a reason instead of just "it hung".
    window.__eftforgeError = function (message) {
      document.getElementById("err").style.display = "block";
      if (message) {
        var detail = document.getElementById("err-detail");
        detail.textContent = message;
        detail.style.display = "block";
      }
    };

    document.getElementById("splash-close").addEventListener("click", function () {
      if (window.__TAURI__) window.__TAURI__.window.getCurrentWindow().close();
    });
  </script>
</body>
</html>
