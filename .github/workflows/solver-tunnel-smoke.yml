name: Solver Cloudflare tunnel smoke test

permissions:
  contents: read

on:
  push:
    branches:
      - smoke/solver-baselines-cloudflare-20260903
    paths:
      - ".github/workflows/solver-tunnel-smoke.yml"
      - ".github/smoke/solver_tunnel_smoke.py"
  workflow_dispatch:

jobs:
  tunnel-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EFTFORGE_PORT: "47651"
      PYTHONUNBUFFERED: "1"
      DISABLE_BG_MIGRATE: "1"
      CLOUDFLARED_VERSION: "2026.8.3"
      CLOUDFLARED_SHA256: "f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install application and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Prepare disposable database
        shell: bash
        run: |
          set -euo pipefail
          data_dir="${RUNNER_TEMP}/eftforge-smoke-data"
          artifact_dir="${RUNNER_TEMP}/smoke-artifacts"
          mkdir -p "$data_dir" "$artifact_dir"
          # The solver smoke excludes the independent Patchright/image-generation subsystem.
          # Its supported lock keeps the browser path deterministic on headless CI runners.
          touch backend/imggen_disabled.lock

          ip_hash_secret=$(openssl rand -hex 32)
          admin_api_key=$(openssl rand -hex 32)
          smoke_token=$(openssl rand -hex 32)
          echo "::add-mask::$ip_hash_secret"
          echo "::add-mask::$admin_api_key"
          echo "::add-mask::$smoke_token"

          {
            echo "IP_HASH_SECRET=$ip_hash_secret"
            echo "ADMIN_API_KEY=$admin_api_key"
            echo "SMOKE_TOKEN=$smoke_token"
            echo "DATABASE_URL=sqlite:///$data_dir/tarkov.db"
            echo "RATINGS_DB_URL=sqlite:///$data_dir/ratings.db"
            echo "BUILDS_DB_URL=sqlite:///$data_dir/builds.db"
            echo "CHANGELOG_DB_URL=sqlite:///$data_dir/changelog.db"
          } >> "$GITHUB_ENV"

          export IP_HASH_SECRET="$ip_hash_secret"
          export ADMIN_API_KEY="$admin_api_key"
          export SMOKE_TOKEN="$smoke_token"
          export DATABASE_URL="sqlite:///$data_dir/tarkov.db"
          export RATINGS_DB_URL="sqlite:///$data_dir/ratings.db"
          export BUILDS_DB_URL="sqlite:///$data_dir/builds.db"
          export CHANGELOG_DB_URL="sqlite:///$data_dir/changelog.db"
          (cd backend && python sync_tarkov_dev.py) > "$artifact_dir/sync.log" 2>&1

      - name: Start token-gated application
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/smoke-artifacts"
          python .github/smoke/solver_tunnel_smoke.py serve > "$artifact_dir/app.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error \
              -H "X-EFTForge-Smoke-Token: $SMOKE_TOKEN" \
              "http://127.0.0.1:${EFTFORGE_PORT}/health" >/dev/null; then
              curl --fail --silent --show-error \
                -H "X-EFTForge-Smoke-Token: $SMOKE_TOKEN" \
                "http://127.0.0.1:${EFTFORGE_PORT}/build-image/busy" \
                | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('busy') is False and d.get('disabled') is True"
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become ready" >&2
          exit 1

      - name: Start verified Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/smoke-artifacts"
          cloudflared_path="${RUNNER_TEMP}/cloudflared"
          curl --fail --location --retry 3 \
            --output "$cloudflared_path" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  ${cloudflared_path}" | sha256sum --check --strict
          chmod 755 "$cloudflared_path"

          "$cloudflared_path" tunnel --no-autoupdate --protocol http2 \
            --url "http://127.0.0.1:${EFTFORGE_PORT}" \
            > "$artifact_dir/cloudflared.log" 2>&1 &
          echo "TUNNEL_PID=$!" >> "$GITHUB_ENV"

          tunnel_url=""
          for attempt in $(seq 1 90); do
            tunnel_url=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' \
              "$artifact_dir/cloudflared.log" | head -n 1 || true)
            if [[ -n "$tunnel_url" ]]; then break; fi
            sleep 1
          done
          test -n "$tunnel_url"

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              -H "X-EFTForge-Smoke-Token: $SMOKE_TOKEN" \
              "$tunnel_url/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            -H "X-EFTForge-Smoke-Token: $SMOKE_TOKEN" \
            "$tunnel_url/health" >/dev/null
          echo "BASE_URL=$tunnel_url" >> "$GITHUB_ENV"

      - name: Chromium solver smoke test through tunnel
        run: python .github/smoke/solver_tunnel_smoke.py smoke

      - name: Stop temporary services
        if: always()
        shell: bash
        run: |
          kill "${TUNNEL_PID:-}" 2>/dev/null || true
          kill "${APP_PID:-}" 2>/dev/null || true

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: solver-cloudflare-smoke-evidence
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: error
          retention-days: 7
