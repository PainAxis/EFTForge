name: Cloudflare tunnel smoke test

permissions:
  contents: read

on:
  push:
    branches:
      - cloudflare-smoke
    paths:
      - ".github/workflows/cloudflare-smoke.yml"
      - ".github/smoke/optimizer_tunnel_smoke.py"
  workflow_dispatch:

jobs:
  tunnel-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EFTFORGE_DESKTOP: "1"
      EFTFORGE_PORT: "47651"
      PYTHONUNBUFFERED: "1"
      CLOUDFLARED_VERSION: "2026.8.3"
      CLOUDFLARED_SHA256: "f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install application and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start application and synchronize public data
        shell: bash
        run: |
          set -euo pipefail
          test_data_dir="${RUNNER_TEMP}/eftforge-smoke-data"
          mkdir -p "$test_data_dir" "${RUNNER_TEMP}/smoke-artifacts"
          echo "EFTFORGE_DATA_DIR=$test_data_dir" >> "$GITHUB_ENV"

          EFTFORGE_DATA_DIR="$test_data_dir" \
            python backend/desktop_main.py > "${RUNNER_TEMP}/smoke-artifacts/app.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:47651/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:47651/ >/dev/null

          for attempt in $(seq 1 180); do
            gun_count=$(curl --fail --silent --show-error http://127.0.0.1:47651/guns | jq 'length')
            if [[ "$gun_count" -gt 0 ]]; then
              echo "Synchronized $gun_count guns"
              exit 0
            fi
            sync_error=$(curl --fail --silent --show-error http://127.0.0.1:47651/desktop/sync-status | jq -r '.error // empty')
            if [[ -n "$sync_error" ]]; then
              echo "Data synchronization failed: $sync_error" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for synchronized gun data" >&2
          exit 1

      - name: Start verified Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          cloudflared_path="${RUNNER_TEMP}/cloudflared"
          curl --fail --location --retry 3 \
            --output "$cloudflared_path" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  ${cloudflared_path}" | sha256sum --check --strict
          chmod 755 "$cloudflared_path"

          "$cloudflared_path" tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:47651 \
            > "${RUNNER_TEMP}/smoke-artifacts/cloudflared.log" 2>&1 &
          echo "TUNNEL_PID=$!" >> "$GITHUB_ENV"

          tunnel_url=""
          for attempt in $(seq 1 90); do
            tunnel_url=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' \
              "${RUNNER_TEMP}/smoke-artifacts/cloudflared.log" | head -n 1 || true)
            if [[ -n "$tunnel_url" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "$tunnel_url" ]]; then
            echo "Cloudflare did not issue a Quick Tunnel URL" >&2
            exit 1
          fi

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error "$tunnel_url/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error "$tunnel_url/" >/dev/null
          echo "BASE_URL=$tunnel_url" >> "$GITHUB_ENV"
          echo "### Temporary smoke-test tunnel" >> "$GITHUB_STEP_SUMMARY"
          echo "$tunnel_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Chromium multi-viewport smoke test through tunnel
        run: python .github/smoke/optimizer_tunnel_smoke.py

      - name: Stop temporary services
        if: always()
        shell: bash
        run: |
          kill "${TUNNEL_PID:-}" 2>/dev/null || true
          kill "${APP_PID:-}" 2>/dev/null || true

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-smoke-evidence
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: error
          retention-days: 7

